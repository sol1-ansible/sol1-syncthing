---
- name: Debug - Show local device ID
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} has device ID: {{ syncthing_device_id }}"

- name: Build device map from all hosts (run once)
  ansible.builtin.set_fact:
    syncthing_device_map: "{{ syncthing_device_map | default({}) | combine({item: hostvars[item].syncthing_device_id}) }}"
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  when: syncthing_devices | default([]) | length == 0

- name: Debug - Show device map
  ansible.builtin.debug:
    msg: "Device map: {{ syncthing_device_map | default('NOT DEFINED') }}"
  run_once: true

- name: Build list of remote devices (excluding self)
  ansible.builtin.set_fact:
    syncthing_devices: >-
      {{
        syncthing_device_map | default({})
        | dict2items
        | rejectattr('key', 'equalto', inventory_hostname)
        | map(attribute='value')
        | map('community.general.dict_kv', 'id')
        | list
        | zip(
            syncthing_device_map | default({})
            | dict2items
            | rejectattr('key', 'equalto', inventory_hostname)
            | map(attribute='key')
            | map('community.general.dict_kv', 'name')
            | list
          )
        | map('combine')
        | list
      }}
  when:
    - syncthing_devices | default([]) | length == 0
    - syncthing_device_map is defined

- name: Debug - Show built syncthing_devices list
  ansible.builtin.debug:
    msg: "syncthing_devices for {{ inventory_hostname }}: {{ syncthing_devices | default([]) }}"

- name: Get existing devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices list"
  become: true
  become_user: "{{ syncthing_user }}"
  register: _syncthing_devices_result
  changed_when: false

- name: Add replica devices to Syncthing configuration
  ansible.builtin.command:
    cmd: >
      {{ syncthing_binary_path }} cli config devices add
      --device-id {{ device.id }}
      --name {{ device.name }}
  become: true
  become_user: "{{ syncthing_user }}"
  when: device.id not in _syncthing_devices_result.stdout
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device

- name: Configure auto-accept for replica devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices {{ device.id }} auto-accept-folders set {{ device.auto_accept | default(true) | string | lower }}"
  become: true
  become_user: "{{ syncthing_user }}"
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device

- name: Configure explicit device addresses for peer devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices {{ syncthing_device_id }} addresses add {{ peer.protocol | default('tcp') }}://{{ peer.address }}:{{ peer.port | default(22000) }}"
  become: true
  become_user: "{{ syncthing_user }}"
  changed_when: true
  loop: "{{ syncthing_peer_address | rejectattr('host', 'equalto', inventory_hostname) | list }}"
  loop_control:
    loop_var: peer
  when: syncthing_peer_address | length > 0
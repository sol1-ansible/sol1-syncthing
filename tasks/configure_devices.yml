---
- name: Debug - Show local device ID
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} has device ID: {{ syncthing_device_id }}"

- name: Store device ID in global map on localhost
  ansible.builtin.set_fact:
    syncthing_device_map: "{{ hostvars['localhost'].syncthing_device_map | default({}) | combine({inventory_hostname: syncthing_device_id}) }}"
  delegate_to: localhost
  delegate_facts: true
  when: syncthing_devices | default([]) | length == 0
  throttle: 1

- name: Debug - Show current device map on localhost
  ansible.builtin.debug:
    msg: "Device map on localhost: {{ hostvars['localhost'].syncthing_device_map | default('NOT DEFINED') }}"

- name: Debug - Show ansible_play_hosts
  ansible.builtin.debug:
    msg: "ansible_play_hosts: {{ ansible_play_hosts }}"

- name: Build list of remote devices from global map
  ansible.builtin.set_fact:
    syncthing_devices: "{{ syncthing_devices | default([]) + [{'id': hostvars['localhost'].syncthing_device_map[item], 'name': item, 'auto_accept': true}] }}"
  loop: "{{ ansible_play_hosts | default([]) }}"
  when:
    - syncthing_devices | default([]) | length == 0
    - hostvars['localhost'].syncthing_device_map is defined
    - item in hostvars['localhost'].syncthing_device_map

- name: Debug - Show built syncthing_devices list
  ansible.builtin.debug:
    msg: "syncthing_devices for {{ inventory_hostname }}: {{ syncthing_devices | default([]) }}"

- name: Get existing devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices list"
  become: true
  become_user: "{{ syncthing_user }}"
  register: _syncthing_devices_result
  changed_when: false

- name: Add replica devices to Syncthing configuration
  ansible.builtin.command:
    cmd: >
      {{ syncthing_binary_path }} cli config devices add
      --device-id {{ device.id }}
      --name {{ device.name }}
  become: true
  become_user: "{{ syncthing_user }}"
  when: device.id not in _syncthing_devices_result.stdout
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device

- name: Configure auto-accept for replica devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices {{ device.id }} auto-accept-folders set {{ device.auto_accept | default(true) | string | lower }}"
  become: true
  become_user: "{{ syncthing_user }}"
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device

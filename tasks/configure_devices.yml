---
- name: Debug - Show local device ID
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} has device ID: {{ syncthing_device_id }}"

- name: Build syncthing_devices - Ensure every host is represented in syncthing_devices
  ansible.builtin.set_fact:
    syncthing_devices: >-
      {%- set out = syncthing_devices | list -%}
      {%- for h in ansible_play_hosts_all -%}
        {%- if h not in (out | map(attribute='name', default='') | list) -%}
          {%- set _ = out.append({'name': h}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Build syncthing_devices - fill IDs from host vars
  ansible.builtin.set_fact:
    syncthing_devices: >-
      {%- set out = [] -%}
      {%- for d in syncthing_devices -%}
        {%- set _ = out.append(d | combine({
              'id': d.id | default('', true)
                    or hostvars[d.name].syncthing_device_id | default('', true)
            })) -%}
      {%- endfor -%}
      {{ out }}

- name: Build syncthing_devices - fetch missing device IDs from non-play hosts
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} --device-id"
  become: true
  become_user: "{{ syncthing_user }}"
  delegate_to: "{{ item }}"
  loop: >-
    {{ syncthing_devices
       | selectattr('id', 'falsy')
       | map(attribute='name')
       | reject('in', ansible_play_hosts_all)
       | list }}
  register: fetched_ids
  changed_when: false

- name: Build syncthing_devices - merge fetched IDs back in
  ansible.builtin.set_fact:
    syncthing_devices: >-
      {%- set found = dict(fetched_ids.results
                           | map(attribute='item')
                           | zip(fetched_ids.results | map(attribute='stdout') | map('trim'))) -%}
      {%- set out = [] -%}
      {%- for d in syncthing_devices -%}
        {%- set _ = out.append(d | combine({
              'id': d.id | default('', true) or found[d.name] | default('')
            })) -%}
      {%- endfor -%}
      {{ out }}

- name: Debug - Show built syncthing_devices list
  ansible.builtin.debug:
    msg: "syncthing_devices for {{ inventory_hostname }}: {{ syncthing_devices | default([]) }}"

- name: Get existing devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices list"
  become: true
  become_user: "{{ syncthing_user }}"
  register: _syncthing_devices_result
  changed_when: false

- name: Add replica devices to Syncthing configuration
  ansible.builtin.command:
    cmd: >
      {{ syncthing_binary_path }} cli config devices add
      --device-id {{ device.id }}
      --name {{ device.name }}
  become: true
  become_user: "{{ syncthing_user }}"
  when: device.id not in _syncthing_devices_result.stdout
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device

- name: Set replica device addresses via Syncthing REST API
  ansible.builtin.uri:
    url: "{{ syncthing_api_url }}/rest/config/devices"
    method: POST
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
    body_format: json
    body:
      deviceID: "{{ device.id }}"
      name: "{{ device.name }}"
      addresses: "{{ _device_addresses }}"
    validate_certs: "{{ syncthing_api_verify_ssl }}"
    status_code: [200, 201, 204]
  vars:
    _device_addresses: >-
      {%- set out = [] -%}
      {%- for a in device.addresses | default([]) -%}
        {%- set _ = out.append(a | string) -%}
      {%- endfor -%}
      {{ out if out else ['dynamic'] }}
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device
    label: "{{ device.name }}"

- name: Configure auto-accept for replica devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config devices {{ device.id }} auto-accept-folders set {{ device.auto_accept | default(true) | string | lower }}"
  become: true
  become_user: "{{ syncthing_user }}"
  changed_when: true
  loop: "{{ syncthing_devices }}"
  loop_control:
    loop_var: device


---
- name: debug
  ansible.builtin.debug:
    msg: "{{ syncthing_device_id }}"

- name: Netbox Update
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/virtualization/virtual-machines/{{ netbox_device_id }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ netbox_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      custom_fields:
        SyncthingGUID: "{{ syncthing_device_id }}"
    status_code: 200, 204
  register: netbox_result
  delegate_to: localhost

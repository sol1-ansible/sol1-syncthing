---
# Configure sync folders with Syncthing
# Supports multiple folders with different owners, permissions, and sync types
# Expects syncthing_folders list in variables

- name: Get existing Syncthing folders
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config folders list"
  become: true
  become_user: "{{ syncthing_user }}"
  register: _syncthing_existing_folders
  changed_when: false

- name: Remove Syncthing default folder
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config folders default delete"
  become: true
  become_user: "{{ syncthing_user }}"
  when: 
   - '"default" in _syncthing_existing_folders.stdout'
   - syncthing_remove_default_folder 
  changed_when: true

- name: Set folder facts
  ansible.builtin.set_fact:
    _folder_path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    _folder_owner: "{{ folder.owner | default(syncthing_user) }}"
    _folder_group: "{{ folder.group | default(syncthing_group) }}"
    _folder_mode: "{{ folder.mode | default('0755') }}"
    _folder_create: "{{ folder.create | default(true) }}"
    _folder_type: "{{ folder.type | default('sendonly') }}"
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Create sync directory (when specified)
  ansible.builtin.file:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    state: directory
    owner: "{{ folder.owner | default(syncthing_user) }}"
    group: "{{ folder.group | default(syncthing_group) }}"
    mode: "{{ folder.mode | default('0755') }}"
  become: true
  when: folder.create | default(true) | bool
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Verify existing sync directory exists
  ansible.builtin.stat:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
  register: _folder_stat
  when: not (folder.create | default(true) | bool)
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Fail if directory does not exist
  ansible.builtin.fail:
    msg: "Sync directory {{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }} does not exist"
  when:
    - not (folder.create | default(true) | bool)
    - _folder_stat.results[folder_idx].stat is defined
    - not _folder_stat.results[folder_idx].stat.exists
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    index_var: folder_idx
    label: "{{ folder.id }}"

- name: Set recursive ACL for Syncthing user on folder
  ansible.builtin.acl:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    entity: "{{ syncthing_user }}"
    etype: user
    permissions: rwX
    recursive: true
    state: present
  become: true
  when: folder.owner | default(syncthing_user) != syncthing_user
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Set recursive default ACL for Syncthing user on folder
  ansible.builtin.acl:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    entity: "{{ syncthing_user }}"
    etype: user
    permissions: rwX
    default: true
    recursive: true
    state: present
  become: true
  when: folder.owner | default(syncthing_user) != syncthing_user
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Set recursive ACL for folder owner on folder
  ansible.builtin.acl:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    entity: "{{ folder.owner | default(syncthing_user) }}"
    etype: user
    permissions: rwX
    recursive: true
    state: present
  become: true
  when: folder.owner | default(syncthing_user) != syncthing_user
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Set recursive default ACL for folder owner on folder
  ansible.builtin.acl:
    path: "{{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}"
    entity: "{{ folder.owner | default(syncthing_user) }}"
    etype: user
    permissions: rwX
    default: true
    recursive: true
    state: present
  become: true
  when: folder.owner | default(syncthing_user) != syncthing_user
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Add folder to Syncthing configuration
  ansible.builtin.command:
    cmd: >
      {{ syncthing_binary_path }} cli config folders add
      --id {{ folder.id }}
      --label {{ folder.label | default(folder.id) }}
      --path {{ folder.path | default(syncthing_storage_root_dir + '/' + folder.id) }}/
      --type {{ folder.type | default('sendonly') }}
      --rescan-intervals {{ folder.rescan_interval | default(300) }}
      --ignore-perms 
  become: true
  become_user: "{{ syncthing_user }}"
  when: folder.id not in _syncthing_existing_folders.stdout
  changed_when: true
  loop: "{{ syncthing_folders }}"
  loop_control:
    loop_var: folder
    label: "{{ folder.id }}"

- name: Build folders with default devices
  ansible.builtin.set_fact:
    _folders_with_devices: >-
      {{
        syncthing_folders | map('combine', {'_default_devices': syncthing_devices | map(attribute='id') | list})
        | list
      }}

- name: Set devices per folder
  ansible.builtin.set_fact:
    _folders_with_devices: >-
      {{
        _folders_with_devices | map('combine', {'devices': item.devices | default(item._default_devices)})
        | list
      }}
  loop: "{{ _folders_with_devices }}"
  loop_control:
    label: "{{ item.id }}"

- name: Share folder with devices
  ansible.builtin.command:
    cmd: "{{ syncthing_binary_path }} cli config folders {{ item.0.id }} devices add --device-id {{ item.1 }}"
  become: true
  become_user: "{{ syncthing_user }}"
  changed_when: true
  register: _share_folder_result
  failed_when:
    - _share_folder_result.rc != 0
    - "'already' not in _share_folder_result.stderr | default('') | lower"
  loop: "{{ _folders_with_devices | subelements('devices') }}"
  loop_control:
    label: "{{ item.0.id }} -> {{ item.1 }}"


